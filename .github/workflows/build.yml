name: build-isa-android-32bit

on:
  push:
  workflow_dispatch:

jobs:
  android-armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build inputstream.adaptive (Android 32-bit, armeabi-v7a)
        run: |
          # Exactly one project .zip must be in the repository root, otherwise an old one can win
          COUNT=$(ls -1 *.zip 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: found $COUNT zip files in the repository root, keep exactly one:"
            ls -la *.zip || true
            exit 1
          fi
          ZIP=$(ls -1 *.zip)
          echo "Using zip: $ZIP"
          unzip -q -o "$ZIP" -d _unzipped
          SCRIPT=$(find . -maxdepth 4 -name build-android.sh -path '*android-build*' | head -n1)
          if [ -z "$SCRIPT" ]; then echo "android-build/build-android.sh not found"; ls -R | head -50; exit 1; fi
          echo "Using $SCRIPT"
          echo "=============================================="
          grep -n 'NEW_VERSION="${NEW_VERSION' "$SCRIPT"
          grep -n 'GetCapabilities: session' "$(dirname "$SCRIPT")/../src/main.cpp" || echo "NOTE: debug log lines not in this zip"
          echo "=============================================="
          bash "$SCRIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: inputstream.adaptive-android-32bit
          path: inputstream.adaptive-android-32bit.zip
