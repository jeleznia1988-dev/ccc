name: android-build
on:
  push:
  workflow_dispatch:
jobs:
  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the uploaded source and build (armeabi-v7a)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/src"
          Z=$(ls *.zip | head -n1)
          echo "Using $Z"
          unzip -q -o "$Z" -d "$RUNNER_TEMP/src"
          ROOT=$(dirname "$(find "$RUNNER_TEMP/src" -maxdepth 3 -path '*android/build-android.sh' | head -n1)")/..
          cd "$ROOT"
          pwd
          sed -i '/^find "\$W\/out"/d' android/build-android.sh
          ABI=armeabi-v7a bash android/build-android.sh
          cp inputstream.adaptive-21.5.99-android-armeabi-v7a.zip "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: inputstream.adaptive-android-armeabi-v7a
          path: inputstream.adaptive-21.5.99-android-armeabi-v7a.zip
